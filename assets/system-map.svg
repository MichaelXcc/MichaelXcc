<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" role="img" aria-labelledby="title desc">
  <title id="title">AI infrastructure engineering map</title>
  <desc id="desc">GPU infrastructure connects to Kubernetes orchestration, distributed training, model serving, and agent applications. Observability and recovery span the whole system.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091624"/><stop offset="1" stop-color="#141435"/></linearGradient>
    <linearGradient id="flow" x2="1"><stop stop-color="#25d8e9"/><stop offset="1" stop-color="#a785fa"/></linearGradient>
  </defs>
  <rect width="1200" height="212" rx="14" fill="url(#bg)"/>
  <text x="30" y="34" fill="#72a9c9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE / FOCUS AREAS</text>
  <path d="M213 102H272M428 102H486M642 102H700M856 102H915" stroke="url(#flow)" stroke-width="2"/>
  <g fill="#50d6e9"><path d="m271 102-8-5v10z"/><path d="m485 102-8-5v10z"/><path d="m699 102-8-5v10z"/><path d="m914 102-8-5v10z"/></g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g><rect x="29" y="69" width="184" height="67" rx="10" fill="#12283b" stroke="#2b7994"/><text x="121" y="97" fill="#e7faff" font-size="17" font-weight="700">GPU / COMPUTE</text><text x="121" y="119" fill="#81a6ba" font-size="11">resources + fault signals</text></g>
    <g><rect x="272" y="69" width="156" height="67" rx="10" fill="#12283b" stroke="#2b7994"/><text x="350" y="97" fill="#e7faff" font-size="17" font-weight="700">KUBERNETES</text><text x="350" y="119" fill="#81a6ba" font-size="11">scheduling + control</text></g>
    <g><rect x="486" y="69" width="156" height="67" rx="10" fill="#12283b" stroke="#2b7994"/><text x="564" y="97" fill="#e7faff" font-size="17" font-weight="700">TRAINING</text><text x="564" y="119" fill="#81a6ba" font-size="11">resilience + recovery</text></g>
    <g><rect x="700" y="69" width="156" height="67" rx="10" fill="#172641" stroke="#6f68b9"/><text x="778" y="97" fill="#f0ebff" font-size="17" font-weight="700">SERVING</text><text x="778" y="119" fill="#aaa1cf" font-size="11">inference + scaling</text></g>
    <g><rect x="915" y="69" width="255" height="67" rx="10" fill="#1d2241" stroke="#7868be"/><text x="1042" y="97" fill="#f0ebff" font-size="17" font-weight="700">AGENT APPLICATIONS</text><text x="1042" y="119" fill="#aaa1cf" font-size="11">knowledge + workflows</text></g>
  </g>
  <path d="M30 166H1170" stroke="#355775"/>
  <text x="600" y="189" text-anchor="middle" fill="#87bbcb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">OBSERVABILITY    •    SECURITY    •    DELIVERY</text>
  <rect x="1" y="1" width="1198" height="210" rx="13" fill="none" stroke="#426b91" stroke-opacity=".46" stroke-width="2"/>
</svg>
