  <circle cx="951" cy="180" r="89" fill="none" stroke="#54b6d3" stroke-opacity=".20" stroke-dasharray="4 8"/>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".76"><path d="M951 180L819 101M951 180L1079 93M951 180L1104 236M951 180L800 264"/></g>
