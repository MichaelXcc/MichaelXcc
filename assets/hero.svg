    <linearGradient id="line" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="orb" x2="0" y2="1"><stop stop-color="#164e73"/><stop offset="1" stop-color="#382365"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#69d9ff" stroke-opacity=".075"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
