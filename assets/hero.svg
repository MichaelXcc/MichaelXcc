<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Xu Chuan — AI Infrastructure Engineer</title>
  <desc id="desc">A dark technical dashboard with a luminous network diagram connecting GPU, Kubernetes, model serving, and agents.</desc>
  <defs>
