  <text x="58" y="167" fill="#f3f8ff" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="700" letter-spacing="2">XU CHUAN</text>
  <rect x="61" y="184" width="135" height="4" rx="2" fill="url(#line)"/>
